[package]
name = "office-rs-print"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Print spooling for office-rs editors: settings/dialog state machine, Windows GDI vector sink, Linux CUPS sink — Scene-IR driven"
readme = "../README.md"

[dependencies]
imaging = "0.0.1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
] }

[dev-dependencies]
serde_json = "1"
