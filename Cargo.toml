[package]
name = "office-rs-print"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/office-rs/print"
description = "Print spooling for office-rs editors: settings/dialog state machine, Windows GDI vector sink, Linux CUPS sink — Scene-IR driven"
readme = "README.md"

[dependencies]
imaging = "0.0.1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Storage_Streams",
    "Foundation",
    "Win32_System_Com",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
